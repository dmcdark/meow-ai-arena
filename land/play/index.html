<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手动圈地 · 人类 vs AI</title>
<style>
:root { color-scheme: light dark; --bg:#f6f5f2; --panel:#fff; --ink:#202025; --muted:#676771; --line:#dddde4; --cell:#e9e8e4; }
@media(prefers-color-scheme:dark) { :root { --bg:#151519; --panel:#222228; --ink:#eeeef3; --muted:#aaaab6; --line:#40404b; --cell:#303039; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif; }
main { max-width:1100px; margin:auto; padding:24px 16px; }
h1 { margin:0; font-size:24px; } p { color:var(--muted); }
.layout { display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:16px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
.setup,.controls { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:14px 0; }
button,select,input { font:inherit; background:var(--bg); color:var(--ink); border:1px solid var(--line); padding:7px 10px; border-radius:6px; }
button { cursor:pointer; } button:disabled { opacity:.45; cursor:default; }
#new { background:#2f6fdf; color:white; border-color:#2f6fdf; }
#seed { width:120px; } #opponent { max-width:100%; }
canvas { width:100%; display:block; background:var(--cell); border-radius:6px; outline-offset:4px; }
#status { min-height:28px; font-weight:600; } #message { color:#d9621b; white-space:pre-wrap; overflow-wrap:anywhere; }
.player { border-left:4px solid #2f6fdf; padding:8px 12px; margin:12px 0; } .player.enemy { border-color:#d9621b; }
.score { font-size:26px; font-weight:700; } .small { font-size:12px; color:var(--muted); }
#events { max-height:180px; overflow:auto; font-size:12px; color:var(--muted); }
.pad { display:grid; grid-template-columns:repeat(3,46px); gap:6px; justify-content:center; margin:16px 0; }
.pad button { touch-action:manipulation; } code { overflow-wrap:anywhere; }
@media(max-width:800px) { .layout { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
<h1>手动圈地 · 人类 vs AI</h1>
<p>你是蓝色，电脑是橙色。离开领地画线，再回到领地完成圈地。方向键 / WASD 转向，不能直接掉头。</p>
<div class="card">
  <div class="setup">
    <label>对手 <select id="opponent" aria-label="电脑对手"></select></label>
    <label>地图种子 <input id="seed" type="number" min="0" max="2147483647" value="1000"></label>
    <button id="new" disabled>开始新对局</button>
  </div>
  <div id="botHint" class="small"></div>
  <div id="message" role="alert"></div>
</div>
<div class="layout" style="margin-top:16px">
  <div class="card">
    <div id="status" aria-live="polite">正在连接本地服务…</div>
    <canvas id="board" width="720" height="720" tabindex="0" aria-label="圈地棋盘，使用方向键或 WASD 转向"></canvas>
    <div class="controls">
      <button id="pause" disabled>继续</button><button id="step" disabled>走一回合</button>
      <label>速度 <select id="speed"><option value="2">2 回合/秒</option><option value="4" selected>4 回合/秒</option><option value="8">8 回合/秒</option></select></label>
      <span id="heading" class="small"></span>
    </div>
    <div class="pad" aria-label="触屏方向控制">
      <span></span><button data-dir="U" aria-label="向上">↑</button><span></span>
      <button data-dir="L" aria-label="向左">←</button><button data-dir="D" aria-label="向下">↓</button><button data-dir="R" aria-label="向右">→</button>
    </div>
    <div class="small">空格暂停 / 继续。未转向时会保持当前方向前进。切换到后台自动暂停。</div>
  </div>
  <aside class="card">
    <div class="player"><strong>你 · 蓝色</strong><div id="humanScore" class="score">—</div><div id="humanInfo" class="small"></div></div>
    <div class="player enemy"><strong>电脑 · 橙色</strong><div id="botScore" class="score">—</div><div id="botInfo" class="small"></div></div>
    <p class="small">撞墙、撞头或轨迹被踩到会阵亡，回到出生点，已有领地保留。600 回合后领地多的一方获胜。出生点 3×3 区域受保护。</p>
    <strong>最近事件</strong><div id="events"></div>
  </aside>
</div>
</main>
<script>
const $ = id => document.getElementById(id);
const opposite = {U:'D',D:'U',L:'R',R:'L'};
const arrows = {U:'↑',D:'↓',L:'←',R:'→'};
const delta = {U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
let token = '', state = null, running = false, busy = false, timer = null, pending = null, history = [];
let opponents = [];

async function api(path, body) {
  const response = await fetch(path, {method:body ? 'POST' : 'GET', cache:'no-store',
    headers:body ? {'Content-Type':'application/json','X-Game-Token':token} : {},
    body:body ? JSON.stringify(body) : undefined});
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || '请求失败');
  return data;
}
function updateControls() {
  $('new').disabled = !token || busy;
  $('pause').disabled = !state || state.done || busy;
  $('step').disabled = !state || state.done || running || busy;
  $('pause').textContent = running ? '暂停' : '继续';
}
function setRunning(value) {
  running = value && state && !state.done;
  clearTimeout(timer); timer = null;
  updateControls();
  if (state) draw();
  if (running && !busy) timer = setTimeout(tick, 1000 / +$('speed').value);
}
function aim(d) {
  if (!state || state.done) return;
  if (d === opposite[state.directions[0]]) {
    $('message').textContent = '不能直接掉头，请先向侧面转向。';
    return;
  }
  pending = d;
  $('message').textContent = '';
  showHeading();
}
function showHeading() {
  if (state) $('heading').textContent = `当前 ${arrows[state.directions[0]]}` + (pending ? ` · 下一回合 ${arrows[pending]}` : '');
}
function draw() {
  if (!state) return;
  const s = state, cv = $('board'), ctx = cv.getContext('2d'), size = 18;
  cv.width = s.width * size; cv.height = s.height * size;
  const dark = matchMedia('(prefers-color-scheme:dark)').matches;
  const land = dark ? ['#26406f','#6a3a1c'] : ['#bcd0f5','#f5cfb4'];
  const head = ['#2f6fdf','#d9621b'];
  const trail = ['#6f9ae8','#e8955f'];
  const cell = getComputedStyle(document.documentElement).getPropertyValue('--cell').trim();
  ctx.fillStyle = cell; ctx.fillRect(0,0,cv.width,cv.height);
  s.owner.forEach((owner,k) => {
    ctx.fillStyle = owner < 0 ? cell : land[owner];
    ctx.fillRect((k%s.width)*size,Math.floor(k/s.width)*size,size-1,size-1);
    if (s.trail[k] >= 0) {
      ctx.fillStyle = trail[s.trail[k]];
      ctx.fillRect((k%s.width)*size+3,Math.floor(k/s.width)*size+3,size-6,size-6);
    }
  });
  s.spawns.forEach(([x,y],i) => {
    ctx.strokeStyle = head[i]; ctx.lineWidth = 2;
    ctx.strokeRect((x-1)*size+1,(y-1)*size+1,3*size-3,3*size-3);
  });
  s.pos.forEach(([x,y],i) => {
    ctx.fillStyle = head[i]; ctx.fillRect(x*size,y*size,size-1,size-1);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(x*size+1,y*size+1,size-3,size-3);
    const [dx,dy] = delta[s.directions[i]], cx = (x+.5)*size, cy = (y+.5)*size;
    ctx.beginPath(); ctx.moveTo(cx-dy*3,cy+dx*3); ctx.lineTo(cx+dx*6,cy+dy*6); ctx.lineTo(cx+dy*3,cy-dx*3); ctx.stroke();
  });
  $('status').textContent = s.done ? `${s.result} · ${s.areas[0]} : ${s.areas[1]}` :
    `${running ? '对战中' : '已暂停'} · 回合 ${s.turn} / ${s.max_turns} · 种子 ${s.seed}`;
  ['human','bot'].forEach((name,i) => {
    $(name+'Score').textContent = `${s.areas[i]} 格`;
    $(name+'Info').textContent = `占比 ${(100*s.areas[i]/(s.width*s.height)).toFixed(1)}% · 阵亡 ${s.deaths[i]} · 击杀 ${s.kills[i]}`;
  });
  showHeading();
}
function addEvents() {
  const death = {wall:'撞墙',head:'撞头',self:'踩到自己的轨迹',cut:'轨迹被切断'};
  state.events.forEach(e => history.unshift(`T${state.turn} ${e.player === 0 ? '你' : '电脑'} ` +
    (e.type === 'death' ? `阵亡（${death[e.reason] || e.reason}）` : `圈地 +${e.cells}`)));
  history = history.slice(0,30);
  $('events').replaceChildren(...history.map(text => {const el=document.createElement('div');el.textContent=text;return el;}));
}
async function tick() {
  if (busy || !state || state.done) return;
  busy = true; updateControls();
  const direction = pending || state.directions[0];
  pending = null;
  try {
    state = await api('/api/step', {id:state.id,turn:state.turn,direction});
    if (pending === opposite[state.directions[0]]) pending = null;
    addEvents(); draw();
    if (state.done) {setRunning(false); if (state.failure) $('message').textContent = state.failure;}
  } catch (e) {
    setRunning(false); $('message').textContent = e.message;
  } finally {
    busy = false; updateControls();
    if (running) timer = setTimeout(tick,1000 / +$('speed').value);
  }
}
function botHint() {
  const bot = opponents.find(o => o.id === $('opponent').value);
  $('botHint').textContent = !bot || bot.id === 'simple' ? '简单电脑使用内置策略，无需编译。' : bot.ready ?
    '这个原版 bot 已编译，可以开始对战。' : `尚未编译。在项目目录运行：python3 land/play.py --prepare-bots '${bot.id}'，完成后刷新页面。`;
}
$('new').onclick = async () => {
  if (busy) return;
  setRunning(false); busy = true; updateControls(); $('message').textContent = '';
  try {
    const seed = Number($('seed').value);
    if (!$('seed').value || !Number.isInteger(seed) || seed < 0 || seed > 2147483647) throw new Error('请输入有效的地图种子。');
    state = await api('/api/new',{opponent:$('opponent').value,seed});
    pending = null; history = []; $('events').replaceChildren(); draw();
    $('board').focus();
    $('message').textContent = '对局已准备好。先选择方向，再点“继续”或按空格开始。';
  } catch (e) { $('message').textContent = e.message; }
  finally { busy = false; updateControls(); }
};
function focusBoard() { if (state) $('board').focus({preventScroll:true}); }
$('pause').onclick = () => { setRunning(!running); focusBoard(); };
$('step').onclick = () => { tick(); focusBoard(); };
$('speed').onchange = () => { if(running) setRunning(true); focusBoard(); };
$('opponent').onchange = () => { botHint(); focusBoard(); };
$('seed').onchange = focusBoard;
$('seed').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); focusBoard(); }
});
document.querySelectorAll('[data-dir]').forEach(button => button.onclick = () => { aim(button.dataset.dir); focusBoard(); });
document.addEventListener('keydown', e => {
  if (e.target.closest('input,select,button') || e.ctrlKey || e.metaKey || e.altKey) return;
  const key = e.key.toLowerCase();
  const dirs = {arrowup:'U',arrowdown:'D',arrowleft:'L',arrowright:'R',w:'U',s:'D',a:'L',d:'R'};
  if (dirs[key]) {e.preventDefault();aim(dirs[key]);}
  if (key === ' ' && !e.repeat) {e.preventDefault();setRunning(!running);}
});
document.addEventListener('visibilitychange',() => {if(document.hidden) setRunning(false);});
window.addEventListener('blur',() => setRunning(false));
window.addEventListener('pagehide',() => {
  if(state && token) fetch('/api/close',{method:'POST',keepalive:true,
    headers:{'Content-Type':'application/json','X-Game-Token':token},body:JSON.stringify({id:state.id})}).catch(()=>{});
});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',draw);
(async () => {
  try {
    const config = await api('/api/config'); token = config.token; opponents = config.opponents;
    $('opponent').replaceChildren(...opponents.map(o => {
      const el=document.createElement('option');el.value=o.id;el.textContent=o.name+(o.ready ? '' : '（未编译）');return el;
    }));
    botHint(); updateControls(); $('status').textContent = '选择对手后，点击“开始新对局”。';
  } catch(e) { $('status').textContent='连接失败';$('message').textContent='请先运行 python3 land/play.py，再打开它输出的本地网页地址。\n'+e.message; }
})();
</script>
</body>
</html>
